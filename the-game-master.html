<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Game Master</title>
    <style>
:root {
  --bg-obsidian: #090a0d;
  --bg-surface-1: #101217;
  --bg-surface-2: #161920;
  --bg-surface-3: #1d212b;
  --bg-input: #0c0e12;

  --border-subtle: #232834;
  --border-strong: #32394a;
  --border-focus: #8b9bb4;

  --text-primary: #f1f3f7;
  --text-secondary: #a2abb9;
  --text-muted: #697386;

  --accent-primary: #d4a853;
  --accent-primary-hover: #e3b965;
  --accent-primary-bg: rgba(212, 168, 83, 0.12);

  --danger-color: #e05252;
  --danger-bg: rgba(224, 82, 82, 0.12);
  --success-color: #38b27b;
  --success-bg: rgba(56, 178, 123, 0.12);
  --warning-color: #f59e0b;

  --rank-f-fg: #94a3b8;
  --rank-f-bg: rgba(148, 163, 184, 0.14);
  --rank-f-border: #64748b;

  --rank-e-fg: #fb923c;
  --rank-e-bg: rgba(251, 146, 60, 0.14);
  --rank-e-border: #ea580c;

  --rank-d-fg: #facc15;
  --rank-d-bg: rgba(250, 204, 21, 0.14);
  --rank-d-border: #ca8a04;

  --rank-c-fg: #4ade80;
  --rank-c-bg: rgba(74, 222, 128, 0.14);
  --rank-c-border: #16a34a;

  --rank-b-fg: #38bdf8;
  --rank-b-bg: rgba(56, 189, 248, 0.15);
  --rank-b-border: #0284c7;

  --rank-a-fg: #c084fc;
  --rank-a-bg: rgba(192, 132, 252, 0.16);
  --rank-a-border: #9333ea;

  --rank-s-fg: #fda4af;
  --rank-s-gold: #f59e0b;
  --rank-s-bg: rgba(225, 29, 72, 0.22);
  --rank-s-border: #e11d48;

  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  background-color: var(--bg-obsidian);
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

.tgm-shell {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background:
    radial-gradient(circle at 50% 0%, rgba(212, 168, 83, 0.05) 0%, transparent 55%),
    var(--bg-obsidian);
}

.tgm-header {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1.25rem;
  padding: 1rem 2rem;
  background-color: rgba(16, 18, 23, 0.92);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border-subtle);
}

.tgm-brand {
  display: flex;
  align-items: center;
  gap: 0.9rem;
}

.tgm-brand-emblem {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  background-color: var(--bg-surface-2);
  border: 1px solid var(--accent-primary);
  color: var(--accent-primary);
}

.tgm-brand-kicker {
  font-family: var(--font-mono);
  font-size: 0.68rem;
  letter-spacing: 0.14em;
  color: var(--accent-primary);
  font-weight: 600;
}

.tgm-footer {
  margin-top: auto;
  border-top: 1px solid var(--border-subtle);
  background-color: rgba(16, 18, 23, 0.75);
  padding: 0.85rem 2rem;
}

.tgm-footer-inner {
  max-width: 1280px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  flex-wrap: wrap;
  font-family: var(--font-mono);
  font-size: 0.68rem;
  letter-spacing: 0.14em;
}

.tgm-footer-protocol {
  color: var(--text-muted);
}

.tgm-footer-license,
.tgm-footer-license:visited {
  color: var(--text-muted);
  text-decoration: none;
  transition: color 0.16s ease;
}

.tgm-footer-license:hover,
.tgm-footer-license:focus-visible {
  color: var(--text-primary);
  text-decoration: none;
  outline: none;
}

.tgm-creator-signature,
.tgm-creator-signature:visited {
  color: var(--accent-primary);
  text-decoration: none;
  opacity: 0.88;
  font-weight: 600;
  transition: color 0.16s ease, opacity 0.16s ease, text-shadow 0.16s ease;
}

.tgm-creator-signature:hover,
.tgm-creator-signature:focus-visible {
  color: var(--accent-primary-hover);
  opacity: 1;
  text-decoration: none;
  text-shadow: 0 0 10px rgba(212, 168, 83, 0.45);
  outline: none;
}

.tgm-brand-title {
  margin: 0;
  font-size: 1.2rem;
  letter-spacing: 0.06em;
  font-weight: 800;
  color: var(--text-primary);
}

.tgm-header-actions {
  display: flex;
  align-items: center;
  gap: 0.65rem;
  flex-wrap: wrap;
}

.tgm-header-mode-indicator {
  display: inline-flex;
  align-items: center;
  gap: 0.55rem;
  padding: 0.4rem 0.85rem;
  background-color: var(--bg-surface-2);
  border: 1px solid var(--border-strong);
  font-family: var(--font-mono);
  font-size: 0.75rem;
  letter-spacing: 0.08em;
  color: var(--accent-primary);
}

.tgm-mode-dot {
  width: 7px;
  height: 7px;
  background-color: var(--accent-primary);
}

.tgm-main {
  flex: 1;
  width: 100%;
  max-width: 1280px;
  margin: 0 auto;
  padding: 2rem;
}

.tgm-status-banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  max-width: 1280px;
  margin: 1rem auto 0;
  padding: 0.75rem 1.25rem;
  border-left: 3px solid var(--accent-primary);
  background-color: var(--bg-surface-2);
  border-top: 1px solid var(--border-subtle);
  border-right: 1px solid var(--border-subtle);
  border-bottom: 1px solid var(--border-subtle);
}

.tgm-status-success {
  border-left-color: var(--success-color);
  background-color: var(--success-bg);
}

.tgm-status-error {
  border-left-color: var(--danger-color);
  background-color: var(--danger-bg);
}

.tgm-status-info {
  border-left-color: var(--accent-primary);
}

.tgm-status-content {
  display: flex;
  align-items: center;
  gap: 0.65rem;
  font-size: 0.9rem;
}

.tgm-status-icon {
  display: inline-flex;
  align-items: center;
}

.tgm-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  padding: 0.55rem 1rem;
  font-family: var(--font-sans);
  font-size: 0.84rem;
  font-weight: 600;
  letter-spacing: 0.02em;
  border: 1px solid transparent;
  cursor: pointer;
  transition: background-color 0.14s ease, border-color 0.14s ease, color 0.14s ease;
  text-decoration: none;
  white-space: nowrap;
}

.tgm-btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.tgm-btn-primary {
  background-color: var(--accent-primary);
  color: #090a0d;
  border-color: var(--accent-primary);
}

.tgm-btn-primary:hover:not(:disabled) {
  background-color: var(--accent-primary-hover);
  border-color: var(--accent-primary-hover);
}

.tgm-btn-primary.is-guardrail-blocked {
  background-color: var(--bg-surface-3);
  color: var(--text-secondary);
  border-color: var(--danger-color);
}

.tgm-btn-secondary {
  background-color: var(--bg-surface-2);
  color: var(--text-primary);
  border-color: var(--border-strong);
}

.tgm-btn-secondary:hover:not(:disabled) {
  background-color: var(--bg-surface-3);
  border-color: var(--text-secondary);
}

.tgm-btn-ghost {
  background-color: transparent;
  color: var(--text-secondary);
  border-color: var(--border-subtle);
}

.tgm-btn-ghost:hover:not(:disabled) {
  background-color: var(--bg-surface-2);
  color: var(--text-primary);
  border-color: var(--border-strong);
}

.tgm-btn-danger {
  background-color: var(--danger-color);
  color: #ffffff;
  border-color: var(--danger-color);
}

.tgm-btn-danger:hover:not(:disabled) {
  background-color: #c83e3e;
}

.tgm-btn-danger-hover:hover:not(:disabled) {
  color: var(--danger-color);
  border-color: var(--danger-color);
  background-color: var(--danger-bg);
}

.tgm-btn-launch {
  width: 100%;
  padding: 0.7rem 1rem;
  background-color: var(--accent-primary-bg);
  color: var(--accent-primary);
  border: 1px solid var(--accent-primary);
  font-family: var(--font-mono);
  font-size: 0.82rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.tgm-btn-launch:hover:not(:disabled) {
  background-color: var(--accent-primary);
  color: #090a0d;
}

.tgm-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  padding: 0;
  background-color: transparent;
  color: var(--text-secondary);
  border: 1px solid var(--border-subtle);
  cursor: pointer;
  transition: all 0.14s ease;
}

.tgm-icon-btn:hover {
  color: var(--text-primary);
  background-color: var(--bg-surface-3);
  border-color: var(--border-strong);
}

.tgm-section-header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 1rem;
  margin-bottom: 1.5rem;
  padding-bottom: 1rem;
  border-bottom: 1px solid var(--border-subtle);
}

.tgm-section-title {
  margin: 0 0 0.3rem 0;
  font-size: 1.25rem;
  font-weight: 700;
  letter-spacing: 0.02em;
}

.tgm-section-subtitle {
  margin: 0;
  color: var(--text-secondary);
  font-size: 0.9rem;
}

.tgm-stat-pill {
  display: inline-block;
  padding: 0.3rem 0.75rem;
  background-color: var(--bg-surface-2);
  border: 1px solid var(--border-strong);
  font-family: var(--font-mono);
  font-size: 0.74rem;
  letter-spacing: 0.08em;
  color: var(--text-secondary);
}

.tgm-bundle-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
  gap: 1.25rem;
}

.tgm-bundle-card {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  background-color: var(--bg-surface-1);
  border: 1px solid var(--border-subtle);
  padding: 1.35rem;
  transition: border-color 0.16s ease, transform 0.16s ease;
}

.tgm-bundle-card:hover {
  border-color: var(--border-strong);
}

.tgm-bundle-card.has-validation-warning {
  border-color: var(--danger-color);
}

.tgm-card-header-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 0.75rem;
  margin-bottom: 0.6rem;
}

.tgm-card-title {
  margin: 0;
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--text-primary);
  line-height: 1.3;
}

.tgm-card-timestamp {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  color: var(--text-muted);
  white-space: nowrap;
}

.tgm-card-description {
  margin: 0 0 1.15rem 0;
  color: var(--text-secondary);
  font-size: 0.88rem;
  line-height: 1.5;
}

.tgm-card-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  margin-bottom: 1.25rem;
}

.tgm-chip {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.25rem 0.6rem;
  background-color: var(--bg-surface-2);
  border: 1px solid var(--border-subtle);
  font-size: 0.78rem;
  color: var(--text-secondary);
}

.tgm-chip strong {
  color: var(--text-primary);
  font-family: var(--font-mono);
}

.tgm-chip-uniform {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  letter-spacing: 0.05em;
  color: var(--accent-primary);
  border-color: rgba(212, 168, 83, 0.3);
  background-color: rgba(212, 168, 83, 0.06);
}

.tgm-chip-subtle {
  font-family: var(--font-mono);
  font-size: 0.74rem;
  color: var(--text-muted);
}

.tgm-chip.is-chip-error {
  color: var(--danger-color);
  border-color: var(--danger-color);
  background-color: var(--danger-bg);
}

.tgm-card-warning {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.5rem 0.75rem;
  margin-bottom: 1rem;
  background-color: var(--danger-bg);
  border: 1px solid var(--danger-color);
  color: var(--danger-color);
  font-size: 0.8rem;
}

.tgm-card-actions {
  display: flex;
  flex-direction: column;
  gap: 0.65rem;
  padding-top: 1rem;
  border-top: 1px solid var(--border-subtle);
}

.tgm-unrestricted-toggle,
.tgm-fast-mode-toggle {
  display: flex;
  align-items: flex-start;
  gap: 0.7rem;
  padding: 0.75rem;
  border: 1px solid rgba(225, 29, 72, 0.45);
  background-color: rgba(225, 29, 72, 0.08);
  color: var(--text-secondary);
  cursor: pointer;
}

.tgm-unrestricted-toggle input,
.tgm-fast-mode-toggle input {
  width: 1rem;
  height: 1rem;
  margin-top: 0.1rem;
  accent-color: var(--danger-color);
}

.tgm-unrestricted-toggle-copy,
.tgm-fast-mode-toggle-copy {
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
}

.tgm-unrestricted-toggle-copy strong,
.tgm-fast-mode-toggle-copy strong {
  color: var(--danger-color);
  font-family: var(--font-mono);
  font-size: 0.75rem;
  letter-spacing: 0.06em;
}

.tgm-unrestricted-toggle-copy small,
.tgm-fast-mode-toggle-copy small {
  line-height: 1.35;
}

.tgm-fast-mode-toggle {
  border-color: rgba(212, 168, 83, 0.45);
  background-color: rgba(212, 168, 83, 0.08);
}

.tgm-fast-mode-toggle input {
  accent-color: var(--accent-primary);
}

.tgm-fast-mode-toggle-copy strong {
  color: var(--accent-primary);
}

.tgm-minimum-severity-control {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 0.75rem;
  padding: 0.75rem;
  border: 1px solid rgba(56, 189, 248, 0.45);
  background-color: rgba(56, 189, 248, 0.08);
}

.tgm-minimum-severity-experimental {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  gap: 0.45rem;
  padding-bottom: 0.55rem;
  border-bottom: 1px solid rgba(245, 158, 11, 0.35);
  color: var(--warning-color);
  font-family: var(--font-mono);
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.07em;
}

.tgm-minimum-severity-experimental svg {
  flex: 0 0 auto;
}

.tgm-minimum-severity-toggle {
  display: flex;
  align-items: flex-start;
  gap: 0.7rem;
  color: var(--text-secondary);
  cursor: pointer;
}

.tgm-minimum-severity-toggle input {
  width: 1rem;
  height: 1rem;
  margin-top: 0.1rem;
  accent-color: var(--rank-b-fg);
}

.tgm-minimum-severity-copy {
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
}

.tgm-minimum-severity-copy strong,
.tgm-minimum-severity-value span {
  color: var(--rank-b-fg);
  font-family: var(--font-mono);
  font-size: 0.75rem;
  letter-spacing: 0.06em;
}

.tgm-minimum-severity-copy small {
  line-height: 1.35;
}

.tgm-minimum-severity-value {
  display: flex;
  align-items: center;
  gap: 0.55rem;
}

.tgm-minimum-severity-value input {
  width: 5.5rem;
  padding: 0.45rem 0.5rem;
  border: 1px solid var(--border-strong);
  background-color: var(--bg-input);
  color: var(--text-primary);
  font-family: var(--font-mono);
  text-align: right;
}

.tgm-minimum-severity-value input:disabled {
  opacity: 0.45;
}

.tgm-card-secondary-actions {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0.5rem;
}

.tgm-empty-state {
  text-align: center;
  padding: 4rem 2rem;
  background-color: var(--bg-surface-1);
  border: 1px dashed var(--border-strong);
}

.tgm-empty-crest {
  display: inline-flex;
  padding: 1rem;
  margin-bottom: 1rem;
  color: var(--accent-primary);
  border: 1px solid var(--border-strong);
  background-color: var(--bg-surface-2);
}

.tgm-empty-title {
  margin: 0 0 0.5rem 0;
  font-size: 1.3rem;
}

.tgm-empty-subtitle {
  margin: 0 auto 1.5rem;
  max-width: 460px;
  color: var(--text-secondary);
}

.tgm-empty-actions {
  display: flex;
  justify-content: center;
  gap: 0.75rem;
}

.tgm-editor {
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
}

.tgm-editor-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  padding: 0.9rem 1.25rem;
  background-color: var(--bg-surface-1);
  border: 1px solid var(--border-strong);
}

.tgm-editor-topbar-left {
  display: flex;
  align-items: center;
  gap: 1rem;
  flex-wrap: wrap;
}

.tgm-editor-context {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.tgm-editor-badge {
  padding: 0.2rem 0.55rem;
  background-color: var(--accent-primary-bg);
  border: 1px solid var(--accent-primary);
  color: var(--accent-primary);
  font-family: var(--font-mono);
  font-size: 0.72rem;
  font-weight: 600;
}

.tgm-editor-metrics {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  color: var(--text-secondary);
}

.tgm-guardrail-banner {
  padding: 0.85rem 1.15rem;
  border: 1px solid var(--border-subtle);
  background-color: var(--bg-surface-1);
  font-size: 0.86rem;
}

.tgm-guardrail-banner.is-valid {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  border-color: rgba(56, 178, 123, 0.45);
  background-color: rgba(56, 178, 123, 0.08);
  color: var(--success-color);
}

.tgm-guardrail-banner.is-invalid {
  border-color: rgba(224, 82, 82, 0.6);
  background-color: rgba(224, 82, 82, 0.08);
  color: #f8b4b4;
}

.tgm-guardrail-banner.is-emphasized {
  border-width: 2px;
  border-color: var(--danger-color);
}

.tgm-guardrail-header {
  display: flex;
  align-items: center;
  gap: 0.55rem;
  font-weight: 700;
  color: var(--danger-color);
  margin-bottom: 0.4rem;
}

.tgm-guardrail-list {
  margin: 0;
  padding-left: 1.4rem;
  color: var(--text-primary);
  font-size: 0.83rem;
}

.tgm-guardrail-list li {
  margin-bottom: 0.2rem;
}

.tgm-editor-metadata-panel {
  display: grid;
  grid-template-columns: 1fr;
  gap: 1.15rem;
  padding: 1.35rem;
  background-color: var(--bg-surface-1);
  border: 1px solid var(--border-subtle);
}

.tgm-field-group {
  display: flex;
  flex-direction: column;
  gap: 0.45rem;
}

.tgm-field-label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-family: var(--font-mono);
  font-size: 0.74rem;
  letter-spacing: 0.07em;
  color: var(--text-secondary);
}

.tgm-field-required {
  color: var(--accent-primary);
}

.tgm-field-optional {
  color: var(--text-muted);
}

.tgm-input,
.tgm-textarea {
  width: 100%;
  padding: 0.6rem 0.8rem;
  background-color: var(--bg-input);
  color: var(--text-primary);
  border: 1px solid var(--border-strong);
  font-family: var(--font-sans);
  font-size: 0.9rem;
  transition: border-color 0.14s ease;
}

.tgm-input:focus,
.tgm-textarea:focus {
  outline: none;
  border-color: var(--accent-primary);
}

.tgm-input.is-invalid {
  border-color: var(--danger-color);
  background-color: rgba(224, 82, 82, 0.06);
}

.tgm-input-lg {
  font-size: 1.05rem;
  font-weight: 600;
  padding: 0.7rem 0.9rem;
}

.tgm-inline-error {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  color: var(--danger-color);
  font-size: 0.8rem;
}

.tgm-editor-categories-header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 1rem;
  padding-top: 0.5rem;
}

.tgm-category-list {
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
}

.tgm-category-block {
  background-color: var(--bg-surface-1);
  border: 1px solid var(--border-subtle);
}

.tgm-category-block.has-category-issue {

}

.tgm-category-header {
  display: flex;
  align-items: center;
  gap: 0.85rem;
  padding: 0.9rem 1.15rem;
  background-color: var(--bg-surface-2);
  border-bottom: 1px solid var(--border-subtle);

}

.tgm-category-index {
  font-family: var(--font-mono);
  font-size: 0.76rem;
  font-weight: 700;
  color: var(--accent-primary);
  padding: 0.35rem 0.6rem;
  background-color: var(--bg-obsidian);
  border: 1px solid var(--border-strong);
  white-space: nowrap;
}

.tgm-category-name-wrap {
  flex: 1;
  min-width: 220px;
}

.tgm-category-name-input {
  font-weight: 600;
}

.tgm-category-meta {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.tgm-category-issue-banner {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.55rem 1.15rem;

  border-bottom: 1px solid rgba(224, 82, 82, 0.4);
  color: var(--danger-color);
  font-size: 0.82rem;
}

.tgm-options-table-head {
  display: grid;
  grid-template-columns: 44px 1fr 290px 52px;
  gap: 0.75rem;
  align-items: center;
  padding: 0.5rem 1.15rem;
  border-bottom: 1px solid var(--border-subtle);
  font-family: var(--font-mono);
  font-size: 0.68rem;
  letter-spacing: 0.08em;
  color: var(--text-muted);
}

.tgm-options-list {
  display: flex;
  flex-direction: column;
}

.tgm-option-row {
  display: grid;
  grid-template-columns: 44px 1fr 290px 52px;
  gap: 0.75rem;
  align-items: center;
  padding: 0.6rem 1.15rem;
  border-bottom: 1px solid var(--border-subtle);
  transition: background-color 0.12s ease;
}

.tgm-option-row:hover {
  background-color: rgba(255, 255, 255, 0.015);
}

.tgm-option-index {
  font-family: var(--font-mono);
  font-size: 0.76rem;
  color: var(--text-muted);
}

.tgm-option-action-cell {
  display: flex;
  justify-content: flex-end;
}

.tgm-rank-selector {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 3px;
  background-color: var(--bg-obsidian);
  padding: 3px;
  border: 1px solid var(--border-strong);
}

.tgm-rank-btn {
  height: 30px;
  padding: 0;
  border: 1px solid transparent;
  background-color: transparent;
  color: var(--text-muted);
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.12s ease;
}

.tgm-rank-btn:hover {
  color: var(--text-primary);
  background-color: var(--bg-surface-2);
}

.tgm-rank-F.is-active {
  color: var(--rank-f-fg);
  background-color: var(--rank-f-bg);
  border-color: var(--rank-f-border);
}

.tgm-rank-E.is-active {
  color: var(--rank-e-fg);
  background-color: var(--rank-e-bg);
  border-color: var(--rank-e-border);
}

.tgm-rank-D.is-active {
  color: var(--rank-d-fg);
  background-color: var(--rank-d-bg);
  border-color: var(--rank-d-border);
}

.tgm-rank-C.is-active {
  color: var(--rank-c-fg);
  background-color: var(--rank-c-bg);
  border-color: var(--rank-c-border);
}

.tgm-rank-B.is-active {
  color: var(--rank-b-fg);
  background-color: var(--rank-b-bg);
  border-color: var(--rank-b-border);
}

.tgm-rank-A.is-active {
  color: var(--rank-a-fg);
  background-color: var(--rank-a-bg);
  border-color: var(--rank-a-border);
}

.tgm-rank-S.is-active {
  color: var(--rank-s-fg);
  background: linear-gradient(135deg, rgba(225, 29, 72, 0.35), rgba(245, 158, 11, 0.25));
  border-color: var(--rank-s-border);
  box-shadow: inset 0 0 6px rgba(245, 158, 11, 0.35);
}

.tgm-category-footer {
  padding: 0.75rem 1.15rem;
  background-color: rgba(12, 14, 18, 0.55);
}

.tgm-quick-add-row {
  display: flex;
  align-items: center;
  gap: 0.65rem;
}

.tgm-empty-categories {
  text-align: center;
  padding: 3rem 1.5rem;
  background-color: var(--bg-surface-1);
  border: 1px dashed var(--danger-color);
  color: var(--text-secondary);
}

.tgm-empty-icon {
  color: var(--danger-color);
  margin-bottom: 0.5rem;
}

.tgm-editor-bottom-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  padding: 1rem 1.25rem;
  background-color: var(--bg-surface-1);
  border: 1px solid var(--border-subtle);
}

.tgm-editor-bottom-actions {
  display: flex;
  align-items: center;
  gap: 0.65rem;
}

.tgm-modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
  background-color: rgba(5, 6, 8, 0.82);
  backdrop-filter: blur(4px);
}

.tgm-modal {
  width: 100%;
  max-width: 480px;
  background-color: var(--bg-surface-1);
  border: 1px solid var(--border-strong);
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
}

.tgm-modal-lg {
  max-width: 680px;
}

.tgm-modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1rem 1.25rem;
  background-color: var(--bg-surface-2);
  border-bottom: 1px solid var(--border-subtle);
}

.tgm-modal-title {
  margin: 0;
  font-size: 1rem;
  font-weight: 700;
}

.tgm-modal-body {
  padding: 1.25rem;
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.tgm-modal-body p {
  margin: 0;
}

.tgm-modal-subtext {
  color: var(--text-secondary);
  font-size: 0.86rem;
}

.tgm-modal-footer {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 0.65rem;
  padding: 0.9rem 1.25rem;
  background-color: var(--bg-surface-2);
  border-top: 1px solid var(--border-subtle);
}

.tgm-import-file-bar {
  display: flex;
  align-items: center;
  gap: 0.85rem;
  flex-wrap: wrap;
}

.tgm-import-hint {
  font-size: 0.82rem;
  color: var(--text-muted);
}

.tgm-code-textarea {
  font-family: var(--font-mono);
  font-size: 0.8rem;
  line-height: 1.45;
  resize: vertical;
}

.tgm-import-error-detail {
  font-family: var(--font-mono);
  font-size: 0.8rem;
  color: var(--text-primary);
}

.tgm-sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  border: 0;
}

@media (max-width: 860px) {
  .tgm-header {
    flex-direction: column;
    align-items: flex-start;
    padding: 1rem 1.25rem;
  }

  .tgm-main {
    padding: 1.25rem;
  }

  .tgm-options-table-head {
    display: none;
  }

  .tgm-option-row {
    grid-template-columns: 32px 1fr auto;
    grid-template-areas:
      'idx label action'
      'idx rank rank';
    gap: 0.5rem;
  }

  .tgm-option-index {
    grid-area: idx;
  }

  .tgm-option-label-cell {
    grid-area: label;
  }

  .tgm-option-rank-cell {
    grid-area: rank;
  }

  .tgm-option-action-cell {
    grid-area: action;
  }

  .tgm-bundle-grid {
    grid-template-columns: 1fr;
  }

  .tgm-minimum-severity-control {
    grid-template-columns: 1fr;
  }

  .tgm-minimum-severity-value {
    justify-content: space-between;
  }

  .tgm-roll-bottom-grid {
    grid-template-columns: 1fr;
  }

  .tgm-reel-window {
    flex-direction: column;
    align-items: flex-start;
  }

  .tgm-verdict-actions {
    flex-direction: column;
    align-items: stretch;
  }
}

@keyframes tgm-snap-flash {
  0% {
    box-shadow: 0 0 0 3px var(--accent-primary), inset 0 0 36px rgba(212, 168, 83, 0.35);
  }
  100% {
    box-shadow: 0 0 0 0 transparent, inset 0 0 0 transparent;
  }
}

@keyframes tgm-screen-shake-s {
  0%, 100% { transform: translate(0, 0); }
  12% { transform: translate(-5px, -3px); }
  25% { transform: translate(5px, 2px); }
  37% { transform: translate(-4px, 3px); }
  50% { transform: translate(4px, -2px); }
  65% { transform: translate(-2px, 1px); }
  80% { transform: translate(2px, -1px); }
}

@keyframes tgm-screen-shake-a {
  0%, 100% { transform: translate(0, 0); }
  20% { transform: translate(-3px, 1px); }
  45% { transform: translate(3px, -1px); }
  70% { transform: translate(-2px, 0); }
}

@keyframes tgm-pulse-roll {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.45; }
}

.tgm-roll-stage {
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
}

.tgm-roll-stage.is-landed-s-rank {
  animation: tgm-screen-shake-s 0.42s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
}

.tgm-roll-stage.is-landed-a-rank {
  animation: tgm-screen-shake-a 0.32s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
}

.tgm-roll-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  padding: 1rem 1.35rem;
  background-color: var(--bg-surface-1);
  border: 1px solid var(--border-subtle);
  flex-wrap: wrap;
}

.tgm-roll-protocol-kicker {
  display: block;
  font-family: var(--font-mono);
  font-size: 0.7rem;
  letter-spacing: 0.12em;
  color: var(--accent-primary);
  margin-bottom: 0.2rem;
}

.tgm-roll-game-title {
  margin: 0;
  font-size: 1.3rem;
  font-weight: 800;
  letter-spacing: 0.02em;
}

.tgm-step-track-container {
  padding: 1.1rem 1.35rem;
  background-color: var(--bg-surface-1);
  border: 1px solid var(--border-subtle);
  display: flex;
  flex-direction: column;
  gap: 0.85rem;
}

.tgm-step-header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  flex-wrap: wrap;
}

.tgm-mandate-counter {
  display: flex;
  align-items: center;
  gap: 0.55rem;
  font-family: var(--font-mono);
  font-size: 0.95rem;
  font-weight: 700;
}

.tgm-mandate-tag {
  padding: 0.25rem 0.6rem;
  background-color: var(--accent-primary-bg);
  border: 1px solid var(--accent-primary);
  color: var(--accent-primary);
  letter-spacing: 0.08em;
}

.tgm-mandate-divider {
  color: var(--text-muted);
}

.tgm-mandate-name {
  color: var(--text-primary);
  letter-spacing: 0.05em;
}

.tgm-mandate-odds {
  display: inline-flex;
  align-items: center;
  gap: 0.45rem;
  font-family: var(--font-mono);
  font-size: 0.75rem;
  color: var(--text-secondary);
}

.tgm-step-segments {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  gap: 0.45rem;
}

.tgm-step-segment {
  height: 6px;
  background-color: var(--bg-surface-3);
  border: 1px solid var(--border-subtle);
  transition: all 0.2s ease;
}

.tgm-step-segment.is-resolved {
  background-color: var(--accent-primary);
  border-color: var(--accent-primary);
}

.tgm-step-segment.is-current-rolling {
  background-color: var(--text-primary);
  border-color: var(--text-primary);
  animation: tgm-pulse-roll 0.6s infinite;
}

.tgm-step-segment.is-current-landed {
  background-color: var(--success-color);
  border-color: var(--success-color);
}

.tgm-reel-arena {
  background-color: var(--bg-surface-1);
  border: 2px solid var(--border-strong);
  transition: border-color 0.18s ease, box-shadow 0.18s ease;
}

.tgm-reel-arena.is-cycling {
  border-color: var(--accent-primary);
}

.tgm-reel-arena.is-locked {
  animation: tgm-snap-flash 0.55s ease-out;
}

.tgm-reel-arena.tgm-arena-rank-S {
  border-color: var(--rank-s-border);
  box-shadow: 0 0 28px rgba(225, 29, 72, 0.28), inset 0 0 22px rgba(245, 158, 11, 0.12);
}

.tgm-reel-arena.tgm-arena-rank-A {
  border-color: var(--rank-a-border);
  box-shadow: 0 0 24px rgba(147, 51, 234, 0.25);
}

.tgm-reel-arena.tgm-arena-rank-B {
  border-color: var(--rank-b-border);
}

.tgm-reel-arena.tgm-arena-rank-C {
  border-color: var(--rank-c-border);
}

.tgm-reel-arena.tgm-arena-rank-D {
  border-color: var(--rank-d-border);
}

.tgm-reel-arena.tgm-arena-rank-E {
  border-color: var(--rank-e-border);
}

.tgm-reel-arena.tgm-arena-rank-F {
  border-color: var(--rank-f-border);
}

.tgm-reel-status-row {

  align-items: center;

  gap: 1rem;

.tgm-reel-telemetry {

.tgm-reel-lock-indicator {

.tgm-reel-window {

.tgm-reel-outcome-column {

}

.tgm-tier-badge-E {
  color: var(--rank-e-fg);
  background-color: var(--rank-e-bg);
  border-color: var(--rank-e-border);
}

.tgm-tier-badge-D {
  color: var(--rank-d-fg);
  background-color: var(--rank-d-bg);
  border-color: var(--rank-d-border);
}

.tgm-tier-badge-C {
  color: var(--rank-c-fg);

}

.tgm-tier-badge-B {
  color: var(--rank-b-fg);
  background-color: var(--rank-b-bg);

}

.tgm-tier-badge-A {
  color: var(--rank-a-fg);

.tgm-tier-badge-S {

.tgm-verdict-details {

.tgm-verdict-severity {

function createUnconstrainedRollResults(
  bundle            ,
  rng               = cryptoRandomOrMathRandom
)               {
  if (!bundle.categories || bundle.categories.length === 0) {
    throw new Error(`Game "${bundle.title}" has no categories to roll.`);
  }

  return bundle.categories.map((category) => ({
    categoryId: category.id,
    categoryName: category.name,
    selectedOption: selectUniform(category.options, rng),
  }));
}
function createConstrainedRollResults(
  bundle            ,
  rng               = cryptoRandomOrMathRandom
)               {
  if (!bundle.categories || bundle.categories.length === 0) {
    throw new Error(`Game "${bundle.title}" has no categories to roll.`);
  }

  if (!bundle.constraints) {
    return createUnconstrainedRollResults(bundle, rng);
  }

  const maxAttempts = bundle.constraints?.maxAttempts ?? DEFAULT_CONSTRAINT_ATTEMPTS;
  const numericAssignmentPools = prepareNumericAssignmentPools(bundle);

  for (let attempt = 0; attempt < maxAttempts; attempt++) {
    const selectedByCategory = new Map                ();
    if (numericAssignmentPools) {
      for (const pool of numericAssignmentPools) {
        const assignment = selectUniform(pool, rng);
        assignment.forEach((option, categoryId) => selectedByCategory.set(categoryId, option));
      }
    }

    const results = bundle.categories.map((category) => ({
      categoryId: category.id,
      categoryName: category.name,
      selectedOption: selectedByCategory.get(category.id) ?? selectUniform(category.options, rng),
    }));

    if (getConstraintViolations(bundle, results).length === 0) {
      return results;
    }
  }

  throw new Error(
    `No valid random configuration was found for "${bundle.title}" after ${maxAttempts} attempts. ` +
      'Review its constraints; they may be too strict or contradictory.'
  );
}

function normalizeName(value        )         {
  return value.replace(/^\[[^\]]+\]\s*/, '').replace(/[^a-z0-9]/gi, '').toLowerCase();
}

function normalizeValue(value        )         {
  return value
    .replace(/\(default\)/gi, '')
    .replace(/(\d+)\.\d+(?=%)/g, (_match, whole        ) => whole)
    .replace(/[^a-z0-9]/gi, '')
    .toLowerCase();
}

function firstInteger(value        )                {
  const match = value.match(/\d+(?:\.\d+)?/);
  return match ? Math.round(Number(match[0])) : null;
}

const SCHEMA_BY_NAME = new Map(SANDBOX_SCHEMA_V34.map((option) => [option.name, option]));
const SCHEMA_NAME_BY_NORMALIZED_NAME = new Map(
  SANDBOX_SCHEMA_V34.map((option) => [normalizeName(option.name), option.name])
);

function resolveSchemaNames(categoryName        )                    {
  const normalized = normalizeName(categoryName);
  const aliased = CATEGORY_ALIASES[normalized];
  if (aliased) {
    return aliased;
  }
  const direct = SCHEMA_NAME_BY_NORMALIZED_NAME.get(normalized);
  return direct ? [direct] : [];
}

function resolveValueIndex(option                     , label        )                {
  const normalizedLabel = normalizeValue(label);
  const exactIndex = option.values.findIndex((candidate) => normalizeValue(candidate) === normalizedLabel);
  if (exactIndex >= 0) {
    return exactIndex;
  }

  const synonyms                                              = {
    nothing: ['none'],
    none0: ['none'],
    '0': ['none'],
    everything: ['all'],
    off: ['disabled', 'none'],
    normal: ['none', 'default'],
    disabled: ['none'],
    '247': ['alwaysopen'],
    default06052150: ['default'],
    instant0: ['none']
  };
  const synonymCandidates = synonyms[normalizedLabel] ?? [];
  for (const synonym of synonymCandidates) {
    const synonymIndex = option.values.findIndex(
      (candidate) => normalizeValue(candidate) === synonym
    );
    if (synonymIndex >= 0) {
      return synonymIndex;
    }
  }

  const numericValue = firstInteger(label);
  if (numericValue !== null) {
    const numericMatches = option.values
      .map((candidate, index) => ({ index, numericValue: firstInteger(candidate) }))
      .filter((candidate) => candidate.numericValue === numericValue);
    if (numericMatches.length === 1) {
      return numericMatches[0].index;
    }
  }

  return null;
}

function is7DaysToDieSummary(summary                               )          {
  return normalizeName(summary.gameTitle).includes('7daystodie');
}
function generate7DaysToDieSandboxCode(
  summary
)                               {
  if (!is7DaysToDieSummary(summary)) {
    return null;
  }

  const encodedByKey = new Map                ();
  const handledResultIndexes = new Set        ();
  const omissions                        = [];

  summary.results.forEach((result            , resultIndex) => {
    const schemaNames = resolveSchemaNames(result.categoryName);
    if (schemaNames.length === 0) {
      omissions.push({
        resultIndex,
        categoryName: result.categoryName,
        optionLabel: result.selectedOption.label,
        reason: 'This decision is not part of SandboxCode and must be applied manually.'
      });
      return;
    }

    const resolved = schemaNames.map((schemaName) => {
      const option = SCHEMA_BY_NAME.get(schemaName);
      if (!option) {
        return null;
      }
      const valueIndex = resolveValueIndex(option, result.selectedOption.label);
      return valueIndex === null ? null : { option, valueIndex };
    });

    if (resolved.some((item) => item === null)) {
      omissions.push({
        resultIndex,
        categoryName: result.categoryName,
        optionLabel: result.selectedOption.label,
        reason: 'The selected value does not exist in the V3.4 Sandbox option schema.'
      });
      return;
    }

    handledResultIndexes.add(resultIndex);
    resolved.forEach((item) => {
      if (item && item.valueIndex !== item.option.defaultIndex) {
        encodedByKey.set(item.option.key, item.valueIndex);
      }
    });
  });

  const blocks = [...encodedByKey.entries()]
    .sort(([left], [right]) => left.localeCompare(right))
    .map(([key, valueIndex]) => `${key}${String.fromCharCode(65 + valueIndex)}`);

  return {
    version: '3.4',
    code: `A${blocks.join('')}`,
    handledResultIndexes,
    encodedOptionCount: blocks.length,
    omissions
  };
}

const RANK_TO_VALUE                                 = {
  F: 1,
  E: 2,
  D: 3,
  C: 4,
  B: 5,
  A: 6,
  S: 7,
};
const VALUE_TO_RANK                                 = {
  1: 'F',
  2: 'E',
  3: 'D',
  4: 'C',
  5: 'B',
  6: 'A',
  7: 'S',
};
function rankToNumber(rank      )         {
  return RANK_TO_VALUE[rank];
}
function numberToRank(score        )       {
  const clamped = Math.min(7, Math.max(1, Math.round(score)));
  return VALUE_TO_RANK[clamped];
}
function evaluateRunDifficulty(results                       )                       {
  if (!Array.isArray(results) || results.length === 0) {
    throw new Error('Cannot evaluate difficulty for an empty results set.');
  }

  let totalScore = 0;
  let sRankCount = 0;

  for (const item of results) {
    const rank = item.selectedOption.rank;
    const numericValue = rankToNumber(rank);
    totalScore += numericValue;

    if (rank === 'S') {
      sRankCount += 1;
    }
  }

  const hasHazardOutlier = sRankCount > 0;
  const allRollsAreS = sRankCount === results.length;

  const rawScore = totalScore / results.length;
  const numericalScore = Math.round(rawScore * 100) / 100;

  const rawRankValue = Math.min(7, Math.max(1, Math.round(rawScore)));
  const rawRank = VALUE_TO_RANK[rawRankValue];

  let overallRank       = rawRank;
  let wasClampedToB = false;
  let hazardBannerMessage                = null;

  if (hasHazardOutlier) {
    if (rawRankValue < RANK_TO_VALUE.B) {
      overallRank = 'B';
      wasClampedToB = true;
      hazardBannerMessage =
        '[ ! ] HAZARD OVERRIDE: S-Tier condition elevated minimum run rating to B.';
    } else {
      overallRank = rawRank;
      wasClampedToB = false;
      hazardBannerMessage = allRollsAreS ? null : '[ ! ] S-TIER CONDITION ACTIVE';
    }
  }

  return {
    numericalScore,
    rawRank,
    overallRank,
    hasHazardOutlier,
    wasClampedToB,
    hazardBannerMessage,
  };
}
function createRunSummary(
  bundle                                  ,
  results              ,
  timestamp         = Date.now(),
  options                    = {}
)             {
  const evaluation = evaluateRunDifficulty(results);

  return {
    gameId: bundle.id,
    gameTitle: bundle.title,
    timestamp,
    results: [...results],
    numericalScore: evaluation.numericalScore,
    rawRank: evaluation.rawRank,
    overallRank: evaluation.overallRank,
    hasHazardOutlier: evaluation.hasHazardOutlier,
    wasClampedToB: evaluation.wasClampedToB,
    hazardBannerMessage: evaluation.hazardBannerMessage,
    constraintsBypassed: options.constraintsBypassed ?? false,
    constraintWarnings: [...(options.constraintWarnings ?? [])],
    minimumSeverityRequested: options.minimumSeverityRequested ?? null,
    severityGenerationAttempts: options.severityGenerationAttempts ?? 1,
  };
}
function executeBundleRoll(
  bundle            ,
  rng               = cryptoRandomOrMathRandom,
  timestamp         = Date.now()
)             {
  const results = createConstrainedRollResults(bundle, rng);

  return createRunSummary(bundle, results, timestamp);
}

class MemoryStorage                            {
          store = new Map                ();

  getItem(key        )                {
    return this.store.has(key) ? (this.store.get(key)          ) : null;
  }

  setItem(key        , value        )       {
    this.store.set(key, value);
  }

  removeItem(key        )       {
    this.store.delete(key);
  }
}

const fallbackMemoryStorage = new MemoryStorage();

function resolveStorage(customStorage                  )                  {
  if (customStorage) {
    return customStorage;
  }
  if (typeof globalThis !== 'undefined' && 'localStorage' in globalThis && globalThis.localStorage) {
    return globalThis.localStorage;
  }
  return fallbackMemoryStorage;
}
function isValidRank(value         )                {
  return typeof value === 'string' && (VALID_RANKS                     ).includes(value);
}
function validateOption(raw         , contextPath        )                                                                   {
  if (typeof raw !== 'object' || raw === null || Array.isArray(raw)) {
    return { valid: false, error: `${contextPath} must be a non-null object.` };
  }

  const candidate = raw                           ;

  if (typeof candidate.id !== 'string' || candidate.id.trim().length === 0) {
    return { valid: false, error: `${contextPath}.id must be a non-empty string.` };
  }

  if (typeof candidate.label !== 'string' || candidate.label.trim().length === 0) {
    return { valid: false, error: `${contextPath}.label must be a non-empty string.` };
  }

  if (!isValidRank(candidate.rank)) {
    return {
      valid: false,
      error: `${contextPath}.rank must be one of [${VALID_RANKS.join(', ')}], received "${String(candidate.rank)}".`,
    };
  }

  if (
    candidate.constraintValue !== undefined &&
    (typeof candidate.constraintValue !== 'number' || !Number.isFinite(candidate.constraintValue))
  ) {
    return { valid: false, error: `${contextPath}.constraintValue must be a finite number when provided.` };
  }

  return {
    valid: true,
    value: {
      id: candidate.id.trim(),
      label: candidate.label.trim(),
      rank: candidate.rank,
      ...(candidate.constraintValue === undefined
        ? {}
        : { constraintValue: candidate.constraintValue }),
    },
  };
}

function validateRollConstraints(

    return { valid: false, error: `${contextPath} must be a non-null object.` };

  const categoryMap = new Map(categories.map((category) => [category.id, category]));
  const optionIds = new Set(categories.flatMap((category) => category.options.map((option) => option.id)));
  const value                  = {};

  const candidate = raw                           ;

  if (typeof candidate.id !== 'string' || candidate.id.trim().length === 0) {
    return { valid: false, error: `${contextPath}.id must be a non-empty string.` };
  }

  if (typeof candidate.name !== 'string' || candidate.name.trim().length === 0) {
    return { valid: false, error: `${contextPath}.name must be a non-empty string.` };
  }

  if (!Array.isArray(candidate.options) || candidate.options.length === 0) {
    return { valid: false, error: `${contextPath}.options must be a non-empty array.` };
  }

  const validatedOptions           = [];
  const seenOptionIds = new Set        ();

  for (let i = 0; i < candidate.options.length; i++) {
    const optCheck = validateOption(candidate.options[i], `${contextPath}.options[${i}]`);
    if (!optCheck.valid) {
      return optCheck;
    }
    if (seenOptionIds.has(optCheck.value.id)) {
      return {
        valid: false,
        error: `${contextPath}.options[${i}] has duplicate option id "${optCheck.value.id}".`,
      };
    }
    seenOptionIds.add(optCheck.value.id);
    validatedOptions.push(optCheck.value);
  }

    valid: true,
    value: {
      id: candidate.id.trim(),
      name: candidate.name.trim(),

  if (typeof candidate.id !== 'string' || candidate.id.trim().length === 0) {
    return { valid: false, error: `${contextPath}.id must be a non-empty string.` };
  }

  if (typeof candidate.title !== 'string' || candidate.title.trim().length === 0) {
    return { valid: false, error: `${contextPath}.title must be a non-empty string.` };
  }

  if (typeof candidate.description !== 'string') {
    return { valid: false, error: `${contextPath}.description must be a string.` };
  }

  if (typeof candidate.createdAt !== 'number' || !Number.isFinite(candidate.createdAt) || candidate.createdAt < 0) {
    return { valid: false, error: `${contextPath}.createdAt must be a valid non-negative timestamp number.` };
  }

  if (typeof candidate.updatedAt !== 'number' || !Number.isFinite(candidate.updatedAt) || candidate.updatedAt < 0) {
    return { valid: false, error: `${contextPath}.updatedAt must be a valid non-negative timestamp number.` };
  }

  if (!Array.isArray(candidate.categories) || candidate.categories.length === 0) {
    return { valid: false, error: `${contextPath}.categories must be a non-empty array.` };
  }

  const seenCategoryIds = new Set        ();

  for (let i = 0; i < candidate.categories.length; i++) {
    const catCheck = validateCategory(candidate.categories[i], `${contextPath}.categories[${i}]`);
    if (!catCheck.valid) {
      return catCheck;
    }
    if (seenCategoryIds.has(catCheck.value.id)) {
      return {
        valid: false,
        error: `${contextPath}.categories[${i}] has duplicate category id "${catCheck.value.id}".`,

    }
    seenCategoryIds.add(catCheck.value.id);
    for (const option of catCheck.value.options) {
      if (seenBundleOptionIds.has(option.id)) {

          error: `${contextPath}.categories[${i}] contains bundle-wide duplicate option id "${option.id}".`,

    valid: true,
    value: {
      id: candidate.id.trim(),
      title: candidate.title.trim(),
      description: candidate.description.trim(),

class BundleStorageEngine {
                   storage                 ;
                   namespace        ;

  constructor(storage                  , namespace         = STORAGE_NAMESPACE) {
    this.storage = resolveStorage(storage);
    this.namespace = namespace;
  }

         getAllBundles()               {
    const raw = this.storage.getItem(this.namespace);

    if (raw === null) {
      const initialSeed = [createDefaultSeedBundle()];
      this.writeBundlesInternal(initialSeed);
      return initialSeed;
    }

    try {
      const parsed          = JSON.parse(raw);
      if (!Array.isArray(parsed)) {
        const fallback = [createDefaultSeedBundle()];
        this.writeBundlesInternal(fallback);
        return fallback;
      }

      const validBundles               = [];
      for (let i = 0; i < parsed.length; i++) {
        const validation = validateGameBundle(parsed[i], `StoredGame[${i}]`);
        if (validation.valid) {
          validBundles.push(validation.value);
        }
      }

      return validBundles;
    } catch {
      const fallback = [createDefaultSeedBundle()];
      this.writeBundlesInternal(fallback);
      return fallback;
    }
  }

         getBundleById(id        )                    {
    const bundles = this.getAllBundles();
    const match = bundles.find((b) => b.id === id);
    return match ? (JSON.parse(JSON.stringify(match))              ) : null;
  }

         saveBundle(bundle            )       {
    const validation = validateGameBundle(bundle, 'Game');
    if (!validation.valid) {
      throw new Error(`Invalid Game: ${validation.error}`);
    }

    const sanitizedBundle = validation.value;
    const bundles = this.getAllBundles();
    const existingIndex = bundles.findIndex((b) => b.id === sanitizedBundle.id);

    if (existingIndex >= 0) {
      bundles[existingIndex] = {
        ...sanitizedBundle,
        createdAt: bundles[existingIndex].createdAt,
        updatedAt: Math.max(Date.now(), sanitizedBundle.updatedAt),
      };
    } else {
      bundles.push(sanitizedBundle);
    }

    this.writeBundlesInternal(bundles);
  }

         deleteBundle(id        )       {
    const bundles = this.getAllBundles();
    const filtered = bundles.filter((b) => b.id !== id);
    this.writeBundlesInternal(filtered);
  }

         exportBundlesToJSON()         {
    const bundles = this.getAllBundles();
    return JSON.stringify(bundles, null, 2);
  }

         importBundlesFromJSON(rawJson        )               {
    if (typeof rawJson !== 'string' || rawJson.trim().length === 0) {
      return {
        success: false,
        error: 'Import payload is empty.',
      };
    }

    let parsed         ;
    try {
      parsed = JSON.parse(rawJson);
    } catch (err) {
      const message = err instanceof Error ? err.message : 'Malformed JSON syntax';
      return {
        success: false,
        error: `JSON Parse Error: ${message}`,
      };
    }

    const rawList            = Array.isArray(parsed) ? parsed : [parsed];

    if (rawList.length === 0) {
      return {
        success: false,
        error: 'Import array must contain at least one Game.',
      };
    }

    const validatedIncoming               = [];
    const incomingIds = new Set        ();

    for (let i = 0; i < rawList.length; i++) {
      const check = validateGameBundle(rawList[i], `Game[${i}]`);
      if (!check.valid) {
        return {
          success: false,
          error: check.error,
        };
      }
      if (incomingIds.has(check.value.id)) {
        return {
          success: false,
          error: `Duplicate game id "${check.value.id}" found within import payload at Game[${i}].`,
        };
      }
      incomingIds.add(check.value.id);
      validatedIncoming.push(check.value);
    }

    const existingBundles = this.getAllBundles();
    const bundleMap = new Map                    ();

    for (const existing of existingBundles) {
      bundleMap.set(existing.id, existing);
    }

    for (const incoming of validatedIncoming) {
      bundleMap.set(incoming.id, incoming);
    }

    this.writeBundlesInternal(Array.from(bundleMap.values()));

    return {
      success: true,
      count: validatedIncoming.length,
    };
  }

          writeBundlesInternal(bundles              )       {
    this.storage.setItem(this.namespace, JSON.stringify(bundles));
  }
}

function evaluateBundleGuardrails(bundle            )                         {
  let titleError                = null;
  const bundleLevelErrors           = [];
  const categoryIssues                                          = {};
  const allErrorMessages           = [];

  if (!bundle.title || bundle.title.trim().length === 0) {
    titleError = 'Game title is required and cannot be empty.';
    allErrorMessages.push(titleError);
  }

  if (!Array.isArray(bundle.categories) || bundle.categories.length === 0) {
    const msg = 'Game must define at least 1 category before saving or launching.';
    bundleLevelErrors.push(msg);
    allErrorMessages.push(msg);
  } else {
    bundle.categories.forEach((cat, idx) => {
      const messages           = [];
      const emptyOptionIds           = [];
      const displayCatName = cat.name.trim() || `Category #${idx + 1}`;

      if (!cat.name || cat.name.trim().length === 0) {
        messages.push(`Category #${idx + 1} requires a valid category name.`);
      }

      if (!Array.isArray(cat.options) || cat.options.length < 2) {
        const count = Array.isArray(cat.options) ? cat.options.length : 0;
        messages.push(
          `"${displayCatName}" has ${count} option${count === 1 ? '' : 's'}. Minimum 2 options required to avoid a trivial roll.`
        );
      }

      if (Array.isArray(cat.options)) {
        cat.options.forEach((opt, optIdx) => {
          if (!opt.label || opt.label.trim().length === 0) {
            emptyOptionIds.push(opt.id);
            messages.push(`"${displayCatName}" Option #${optIdx + 1} has an empty outcome label.`);
          }
          if (!isValidRank(opt.rank)) {
            messages.push(`"${displayCatName}" Option #${optIdx + 1} has an invalid difficulty rank.`);
          }
        });
      }

      if (messages.length > 0) {
        categoryIssues[cat.id] = {

  const rankLimits = bypassConstraints ? [] : bundle.constraints?.rankLimits ?? [];

        (total, category) =>
          total + Math.max(...category.options.map((option) => rankToNumber(option.rank))),
        0
      ) / bundle.categories.length

  // Dynamic programming produces an upper bound that respects every global rank cap.
  // Forbidden combinations and numeric constraints can only lower this value further.
  let states = new Map                ([
    [rankLimits.map(() => 0).join(','), 0],
  ]);

  for (const category of bundle.categories) {
    const nextStates = new Map                ();
    const distinctRanks = [...new Set(category.options.map((option) => option.rank))];
    for (const [stateKey, total] of states) {
      const counts = stateKey.split(',').map(Number);
      for (const rank of distinctRanks) {
        const nextCounts = counts.map(
          (count, index) => count + (rankLimits[index].ranks.includes(rank) ? 1 : 0)
        );
        if (nextCounts.some((count, index) => count > rankLimits[index].max)) {
          continue;
        }
        const nextKey = nextCounts.join(',');
        const nextTotal = total + rankToNumber(rank);
        if (nextTotal > (nextStates.get(nextKey) ?? Number.NEGATIVE_INFINITY)) {
          nextStates.set(nextKey, nextTotal);
        }
      }
    }
    states = nextStates;
  }

  if (states.size === 0) {
    return 0;
  }
  const maximumTotal = Math.max(...states.values());
  return maximumTotal / bundle.categories.length;

function formatRunDossierMarkdown(summary            )         {
  const isoTimestamp = new Date(summary.timestamp).toISOString().replace('T', ' ').slice(0, 19);
  const scoreFormatted = `${summary.numericalScore.toFixed(2)} / 7.00 SEVERITY`;

  const lines           = [
    `# THE GAME MASTER // ARBITER FINAL VERDICT`,
    `**Game Protocol:** ${summary.gameTitle}`,
    `**Overall Difficulty Rank:** RANK ${summary.overallRank} (${OVERALL_RANK_TITLES[summary.overallRank]})`,
    `**Severity Metric:** ${scoreFormatted}`,
    `**Timestamp (UTC):** ${isoTimestamp}`,
  ];

  if (summary.hazardBannerMessage) {
    lines.push(`> ${summary.hazardBannerMessage}`);
  }

  if (summary.minimumSeverityRequested !== null) {
    lines.push(
      `**Minimum Severity Target:** >= ${summary.minimumSeverityRequested.toFixed(2)}`,
      `**Generation Attempts:** ${summary.severityGenerationAttempts}`
    );
  }

  if (summary.constraintsBypassed) {
    lines.push(
      '> [!WARNING] UNRESTRICTED RNG WAS USED. PLAYABILITY WAS NOT GUARANTEED.'
    );
    if (summary.constraintWarnings.length > 0) {
      lines.push('>', '> Violated playability guardrails:');
      summary.constraintWarnings.forEach((warning) => lines.push(`> - ${warning}`));
    } else {
      lines.push('> No configured incompatibility was detected in this result.');
    }
  }

  const sandboxCode = generate7DaysToDieSandboxCode(summary);
  if (sandboxCode) {
    lines.push(
      '',
      '## 7 DAYS TO DIE SANDBOX CODE',
      `**Schema:** V${sandboxCode.version}`,
      `**SandboxCode:** \`${sandboxCode.code}\``,
      `**Encoded or defaulted mandates:** ${sandboxCode.handledResultIndexes.size} / ${summary.results.length}`
    );
    if (sandboxCode.omissions.length > 0) {
      lines.push(
        `> ${sandboxCode.omissions.length} mandate${sandboxCode.omissions.length === 1 ? '' : 's'} must be applied manually or reviewed because they are outside the V${sandboxCode.version} SandboxCode schema.`
      );
    }
  }

  lines.push('', '## SEALED MANDATE BREAKDOWN');

  summary.results.forEach((res, idx) => {
    const num = String(idx + 1).padStart(2, '0');
    lines.push(
      `- [ ] **MANDATE ${num} // ${res.categoryName.toUpperCase()}:** ${res.selectedOption.label} \`[RANK ${res.selectedOption.rank}]\``
    );
  });

  lines.push('', '---', '*Generated by The Game Master (Strict 1/N Uniform Arbiter)*');

  return lines.join('\n');
}

class GameMasterUIController {
                   root             ;
          viewMode           = 'LIBRARY';
          bundles               = [];

          draftBundle                    = null;
          isCreatingNew = false;
          showValidationErrors = false;

          pendingDeleteBundle                    = null;
          importModalOpen = false;
          importDraftText = '';
          importErrorMessage                = null;
          statusBanner                      = null;
          statusTimeoutId                = null;
          bypassConstraintBundleIds = new Set        ();
          fastModeBundleIds = new Set        ();
          minimumSeverityByBundleId = new Map                ();

          onBeginSequenceCallback                        ;
          onSequenceCompleteCallback                           ;
                   rollController                          ;
          completedRunSummary                    = null;
          completedChecklistIndices = new Set        ();
          dossierCopyConfirmed = false;
          copyResetTimeoutId                = null;

  constructor(
    rootElement             ,
    onBeginSequence                        ,
    onSequenceComplete
  ) {
    this.root = rootElement;
    this.onBeginSequenceCallback = onBeginSequence;
    this.onSequenceCompleteCallback = onSequenceComplete;

    this.rollController = new SequentialRollController({
      onStateChange: () => {
        this.render();
      },
      onAbortRun: () => {
        this.completedRunSummary = null;
        this.dossierCopyConfirmed = false;
        this.viewMode = 'LIBRARY';
        this.render();
        this.setStatusBanner(
          'info',
          'Run aborted. Ephemeral mandate history wiped. Returned to Game Library.'
        );
      },
      onCompleteRun: (summary            ) => {
        this.completedRunSummary = summary;
        this.completedChecklistIndices.clear();
        this.dossierCopyConfirmed = false;
        if (this.onSequenceCompleteCallback) {
          this.onSequenceCompleteCallback(summary);
        } else {
          this.viewMode = 'VERDICT_HANDOFF';
          this.render();
        }
      },
    });
  }

         init()       {
    this.refreshBundles();
    this.bindRootDelegation();
    this.render();
  }

         setBeginSequenceHandler(handler                       )       {
    this.onBeginSequenceCallback = handler;
  }

         setSequenceCompleteHandler(handler                          )       {
    this.onSequenceCompleteCallback = handler;
  }

         getRollController()                           {
    return this.rollController;
  }

         refreshBundles()       {
    this.bundles = getAllBundles();
  }

          setStatusBanner(type                      , message        , autoClearMs = 5000)       {
    if (this.statusTimeoutId !== null && typeof window !== 'undefined') {
      window.clearTimeout(this.statusTimeoutId);
      this.statusTimeoutId = null;
    }

    this.statusBanner = { type, message };
    this.renderStatusBannerOnly();

    if (autoClearMs > 0 && typeof window !== 'undefined') {
      this.statusTimeoutId = window.setTimeout(() => {
        this.statusBanner = null;
        this.renderStatusBannerOnly();
      }, autoClearMs);
    }
  }

          renderStatusBannerOnly()       {

    if (slot) {
      slot.innerHTML = this.renderStatusBannerMarkup();
    }
  }

          handleCreateNewBundle()       {
    const now = Date.now();
    this.isCreatingNew = true;
    this.showValidationErrors = false;
    this.draftBundle = {
      id: generateId('game'),
      title: 'New Challenge Protocol',
      description: 'Define non-negotiable parameters and category pools for this run.',
      createdAt: now,
      updatedAt: now,
      categories: [
        {
          id: generateId('cat'),
          name: 'Primary Restriction',
          options: [
            { id: generateId('opt'), label: 'Standard Loadout Permitted', rank: 'F' },
            { id: generateId('opt'), label: 'Restricted Equipment Lock', rank: 'B' },
          ],
        },
      ],
    };
    this.viewMode = 'EDITOR';
    this.render();
  }

          handleEditBundle(bundleId        )       {
    const existing = getBundleById(bundleId);
    if (!existing) {
      this.setStatusBanner('error', 'Target game could not be found in storage.');
      return;
    }

    this.isCreatingNew = false;
    this.showValidationErrors = false;
    this.draftBundle = JSON.parse(JSON.stringify(existing))              ;
    this.viewMode = 'EDITOR';
    this.render();
  }

          handleDuplicateBundle(bundleId        )       {
    const existing = getBundleById(bundleId);
    if (!existing) {
      this.setStatusBanner('error', 'Cannot duplicate: source game not found.');
      return;
    }

    const now = Date.now();
    const clonedCategories             = existing.categories.map((cat) => ({
      id: generateId('cat'),
      name: cat.name,
      options: cat.options.map((opt) => ({
        id: generateId('opt'),
        label: opt.label,
        rank: opt.rank,
      })),
    }));

    const duplicated             = {
      id: generateId('game'),
      title: `${existing.title} (Copy)`,
      description: existing.description,
      categories: clonedCategories,
      createdAt: now,
      updatedAt: now,
    };

    try {
      saveBundle(duplicated);
      this.refreshBundles();
      this.render();
      this.setStatusBanner('success', `Duplicated game "${duplicated.title}".`);
    } catch (err) {
      const msg = err instanceof Error ? err.message : 'Failed to duplicate game.';
      this.setStatusBanner('error', msg);
    }
  }

          handleRequestDeleteBundle(bundleId        )       {

    if (!target) {
      return;
    }
    this.pendingDeleteBundle = target;
    this.render();
  }

          handleConfirmDeleteBundle()       {
    if (!this.pendingDeleteBundle) {

    const deletedTitle = this.pendingDeleteBundle.title;

      this.setStatusBanner('error', 'Selected game could not be loaded.');

    const report = evaluateBundleGuardrails(target);
    if (!report.isValid) {
      this.setStatusBanner(
        'error',
        `Cannot launch "${target.title}": ${report.allErrorMessages[0]}`
      );
      return;
    }

    const fastMode = this.fastModeBundleIds.has(bundleId);
    const minimumSeverity = this.minimumSeverityByBundleId.get(bundleId) ?? null;
    const bypassConstraints =
      Boolean(target.constraints) &&
      (this.bypassConstraintBundleIds.has(bundleId) || minimumSeverity !== null);

    if (this.onBeginSequenceCallback) {
      this.onBeginSequenceCallback(target);
      return;
    }

    this.completedRunSummary = null;
    this.statusBanner = null;
    this.viewMode = 'ROLL_SEQUENCE';
    try {
      this.rollController.startSequence(
        target,
        false,
        bypassConstraints,
        fastMode,
        minimumSeverity
      );
    } catch (err) {
      const message = err instanceof Error ? err.message : 'Unable to create a valid random configuration.';
      this.viewMode = 'LIBRARY';
      this.setStatusBanner('error', message, 10000);
    }
  }

          handleExportLibrary()       {
    try {
      const jsonString = exportBundlesToJSON();
      const blob = new Blob([jsonString], { type: 'application/json;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement('a');
      const dateStamp = new Date().toISOString().slice(0, 10);
      anchor.href = url;
      anchor.download = `tgm-games-${dateStamp}.json`;
      document.body.appendChild(anchor);
      anchor.click();
      document.body.removeChild(anchor);
      URL.revokeObjectURL(url);

      this.setStatusBanner(
        'success',
        `Exported ${this.bundles.length} game${this.bundles.length === 1 ? '' : 's'} to JSON.`
      );

    );

    this.render();
  }

          handleSetOptionRank(categoryId        , optionId        , rank      )       {
    if (!this.draftBundle) {
      return;
    }
    const cat = this.draftBundle.categories.find((c) => c.id === categoryId);
    if (!cat) {
      return;
    }
    const opt = cat.options.find((o) => o.id === optionId);
    if (!opt) {
      return;
    }
    opt.rank = rank;

    const selectorGroup = this.root.querySelector             (
      `[data-role="rank-selector"][data-category-id="${categoryId}"][data-option-id="${optionId}"]`
    );
    if (selectorGroup) {
      const buttons = selectorGroup.querySelectorAll                   ('button[data-rank]');
      buttons.forEach((btn) => {
        const isSelected = btn.getAttribute('data-rank') === rank;
        btn.classList.toggle('is-active', isSelected);
        btn.setAttribute('aria-pressed', isSelected ? 'true' : 'false');
      });
    } else {
      this.render();
    }
  }

          bindRootDelegation()       {
    this.root.addEventListener('click', (event            ) => {
      const target = event.target                      ;
      if (!target) {
        return;
      }

      const actionEl = target.closest             ('[data-action]');
      if (!actionEl) {
        return;
      }

      const action = actionEl.getAttribute('data-action');
      const bundleId = actionEl.getAttribute('data-bundle-id') ?? '';
      const categoryId = actionEl.getAttribute('data-category-id') ?? '';
      const optionId = actionEl.getAttribute('data-option-id') ?? '';

      switch (action) {
        case 'create-bundle':
          this.handleCreateNewBundle();
          break;
        case 'export-library':
          this.handleExportLibrary();
          break;
        case 'open-import-modal':
          this.handleOpenImportModal();
          break;
        case 'close-import-modal':
          this.handleCloseImportModal();
          break;
        case 'confirm-import':
          this.handleExecuteImport();
          break;
        case 'trigger-file-input': {
          const fileInput = this.root.querySelector                  ('#tgm-import-file-input');
          if (fileInput) {
            fileInput.click();
          }
          break;
        }
        case 'begin-sequence':
          this.handleBeginSequence(bundleId);
          break;
        case 'edit-bundle':
          this.handleEditBundle(bundleId);
          break;
        case 'duplicate-bundle':
          this.handleDuplicateBundle(bundleId);
          break;
        case 'request-delete-bundle':
          this.handleRequestDeleteBundle(bundleId);
          break;
        case 'cancel-delete-bundle':
          this.pendingDeleteBundle = null;
          this.render();
          break;
        case 'confirm-delete-bundle':
          this.handleConfirmDeleteBundle();
          break;
        case 'save-bundle':
          this.handleSaveDraftBundle();
          break;
        case 'cancel-edit':
          this.handleCancelEdit();
          break;
        case 'add-category':
          this.handleAddCategory();
          break;
        case 'delete-category':
          this.handleDeleteCategory(categoryId);
          break;
        case 'add-option':
          this.handleAddOption(categoryId);
          break;
        case 'delete-option':
          this.handleDeleteOption(categoryId, optionId);
          break;
        case 'select-rank': {
          const rankAttr = actionEl.getAttribute('data-rank')               ;
          if (rankAttr && (VALID_RANKS                     ).includes(rankAttr)) {
            this.handleSetOptionRank(categoryId, optionId, rankAttr);
          }
          break;
        }
        case 'pull-lever':
          this.rollController.initiateCategoryRoll();
          break;
        case 'advance-sequence':
          this.rollController.advanceToNextStep();
          break;
        case 'abort-sequence':
          this.rollController.abortSequence();
          break;
        case 'copy-run-dossier':
          this.handleCopyRunDossier();
          break;
        case 'copy-sandbox-code':
          this.handleCopySandboxCode();
          break;
        case 'check-all-dossier-items':
          if (this.completedRunSummary) {
            this.completedRunSummary.results.forEach((_, index) =>
              this.completedChecklistIndices.add(index)
            );
            this.render();
          }
          break;
        case 'clear-dossier-checklist':
          this.completedChecklistIndices.clear();
          this.render();
          break;
        case 'return-to-library':
          this.completedRunSummary = null;
          this.completedChecklistIndices.clear();
          this.dossierCopyConfirmed = false;
          this.viewMode = 'LIBRARY';
          this.render();
          break;
        case 'dismiss-status':
          this.statusBanner = null;
          this.renderStatusBannerOnly();
          break;
      }
    });

    this.root.addEventListener('input', (event       ) => {
      const target = event.target                                                 ;
      if (!target) {
        return;
      }

      const field = target.getAttribute('data-field');
      if (!field) {
        return;
      }

      if (field === 'import-json-textarea') {
        this.importDraftText = target.value;
        return;
      }

      if (field === 'bypass-constraints') {
        const bundleId = target.getAttribute('data-bundle-id') ?? '';
        if (target instanceof HTMLInputElement && target.checked) {
          this.bypassConstraintBundleIds.add(bundleId);
        } else {
          this.bypassConstraintBundleIds.delete(bundleId);
        }
        return;
      }

      if (field === 'fast-mode') {
        const bundleId = target.getAttribute('data-bundle-id') ?? '';
        if (target instanceof HTMLInputElement && target.checked) {
          this.fastModeBundleIds.add(bundleId);
        } else {
          this.fastModeBundleIds.delete(bundleId);
        }
        return;
      }

      if (field === 'minimum-severity-enabled') {
        const bundleId = target.getAttribute('data-bundle-id') ?? '';
        if (target instanceof HTMLInputElement && target.checked) {
          this.minimumSeverityByBundleId.set(
            bundleId,
            this.minimumSeverityByBundleId.get(bundleId) ?? DEFAULT_MINIMUM_SEVERITY
          );
        } else {
          this.minimumSeverityByBundleId.delete(bundleId);
        }
        this.render();
        return;
      }

      if (field === 'minimum-severity-threshold') {
        const bundleId = target.getAttribute('data-bundle-id') ?? '';
        const parsed = Number(target.value);
        if (Number.isFinite(parsed) && parsed >= 1 && parsed <= 7) {
          this.minimumSeverityByBundleId.set(bundleId, parsed);
        }
        return;
      }

      if (field === 'dossier-checklist-item') {
        const resultIndex = Number(target.getAttribute('data-result-index'));
        if (Number.isInteger(resultIndex) && resultIndex >= 0) {
          if (target instanceof HTMLInputElement && target.checked) {
            this.completedChecklistIndices.add(resultIndex);
          } else {
            this.completedChecklistIndices.delete(resultIndex);
          }
          target.closest('.tgm-dossier-card')?.classList.toggle('is-checked', target.checked);
          const progress = this.root.querySelector             ('[data-role="dossier-checklist-progress"]');
          if (progress && this.completedRunSummary) {
            progress.textContent = `${this.completedChecklistIndices.size} / ${this.completedRunSummary.results.length} APPLIED`;
          }
        }
        return;
      }

      if (!this.draftBundle) {
        return;
      }

      if (field === 'bundle-title') {
        this.draftBundle.title = target.value;
        this.refreshEditorValidationOutlines();
      } else if (field === 'bundle-description') {
        this.draftBundle.description = target.value;
      } else if (field === 'category-name') {
        const categoryId = target.getAttribute('data-category-id');
        const cat = this.draftBundle.categories.find((c) => c.id === categoryId);
        if (cat) {
          cat.name = target.value;
          this.refreshEditorValidationOutlines();
        }
      } else if (field === 'option-label') {
        const categoryId = target.getAttribute('data-category-id');
        const optionId = target.getAttribute('data-option-id');
        const cat = this.draftBundle.categories.find((c) => c.id === categoryId);
        const opt = cat?.options.find((o) => o.id === optionId);
        if (opt) {
          opt.label = target.value;
          this.refreshEditorValidationOutlines();
        }
      }
    });

    this.root.addEventListener('keydown', (event               ) => {
      const target = event.target                      ;
      if (!target) {
        return;
      }
      if (event.key === 'Enter' && target.getAttribute('data-action') === 'quick-add-input') {
        event.preventDefault();
        const categoryId = target.getAttribute('data-category-id') ?? '';
        if (categoryId) {
          this.handleAddOption(categoryId);
        }
      }
    });

    if (typeof window !== 'undefined') {
      window.addEventListener('keydown', (event               ) => {
        if (this.viewMode !== 'ROLL_SEQUENCE') {
          return;
        }
        const activeTag = document.activeElement?.tagName.toLowerCase();
        if (event.key === ' ' || event.key === 'Enter') {
          if (activeTag !== 'input' && activeTag !== 'textarea' && activeTag !== 'button') {
            const snapshot = this.rollController.getSnapshot();
            if (snapshot.stage === 'READY') {
              event.preventDefault();
              this.rollController.initiateCategoryRoll();
            } else if (snapshot.stage === 'LANDED') {
              event.preventDefault();
              this.rollController.advanceToNextStep();
            }
          }
        }
      });
    }

    this.root.addEventListener('change', (event       ) => {
      const target = event.target                           ;
      if (!target || target.id !== 'tgm-import-file-input') {
        return;
      }

      const file = target.files?.[0];
      if (!file) {
        return;
      }

      const reader = new FileReader();
      reader.onload = () => {
        if (typeof reader.result === 'string') {
          this.importDraftText = reader.result;
          this.importErrorMessage = null;
          this.render();
        }
      };
      reader.onerror = () => {
        this.importErrorMessage = 'Failed to read selected file from disk.';
        this.render();
      };
      reader.readAsText(file);
    });
  }

          refreshEditorValidationOutlines()       {
    if (!this.draftBundle) {
      return;
    }
    const report = evaluateBundleGuardrails(this.draftBundle);

    const saveBtn = this.root.querySelector                   ('[data-action="save-bundle"]');
    if (saveBtn) {
      saveBtn.classList.toggle('is-guardrail-blocked', !report.isValid);
    }

    const bannerSlot = this.root.querySelector             ('[data-role="editor-validation-slot"]');
    if (bannerSlot) {
      bannerSlot.innerHTML = this.renderEditorValidationSummary(report);
    }
  }

          renderEditorValidationSummary(report                        )         {
    if (report.isValid) {

          ${Icons.check}
          <span>All guardrails satisfied. Game is ready to save and launch.</span>

        <div class="tgm-guardrail-header">
          ${Icons.alertDiamond}

            report.allErrorMessages.length === 1 ? '' : 's'

        </div>
        <ul class="tgm-guardrail-list">

        </ul>
